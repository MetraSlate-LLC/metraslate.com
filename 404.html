       (see each page's <Helmet> block) — a static default here would sit as a second, duplicate
       tag next to the real one on every prerendered page, since Helmet prepends rather than
       replaces. Only page-independent tags belong in this base shell. -->

  <meta property="og:url" content="https://metraslate.com" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- Our own traffic count (D-400) — first-party, no cookie, no third-party tag. Deferred, so it
       never delays a paint. It posts to beacon.metraslate.com, which does not resolve until the
       tunnel in state/RUNBOOK-site-traffic-live.md is up; every failure path is silent by design,
       so the page is identical either way. -->
  <script defer src="/beacon.js"></script>
