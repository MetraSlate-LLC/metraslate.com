  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\"><link href=\"https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@100..800&display=swap\" rel=\"stylesheet\">\n<title>STANDARD Metrology Edition — introducing<\u002Ftitle>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* vietnamese */\n\n/* latin-ext */\n\n/* latin */\n\n/* cyrillic-ext */\n\n/* cyrillic */\n\n/* greek */\n\n/* vietnamese */\n\n/* latin-ext */\n\n/* latin */\n\n/* cyrillic-ext */\n\n/* cyrillic */\n\n/* greek */\n\n/* vietnamese */\n\n/* latin-ext */\n\n/* latin */\n\n<\u002Fstyle>\n<style>\n  html,body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; }\n  body { font-family:'JetBrains Mono',monospace; }\n  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; background:#000; transform-origin:top left; overflow:hidden; }\n  .center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }\n  #intro { font-size:44px; letter-spacing:.46em; color:#c9ccd1; text-transform:uppercase; white-space:pre; }\n  #intro .cur { display:inline-block; width:.62em; height:1.06em; background:#c9ccd1; vertical-align:-0.12em; margin-left:.12em; }\n  #lockwrap { position:relative; }\n  #lockwrap > div { will-change:transform,filter,opacity; }\n  #sback { position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); height:640px; z-index:0; }\n  #lockinner { position:relative; z-index:1; }\n  #lockinner, #lockwrap .g { display:flex; flex-direction:column; align-items:center; gap:28px; }\n  .lock { display:flex; align-items:baseline; color:#fff; font-family:'Archivo',sans-serif; font-size:196px; font-weight:800; font-stretch:125%; line-height:.86; }\n  .ed { font-family:'JetBrains Mono',monospace; font-size:27px; letter-spacing:.42em; color:#c9ccd1; text-transform:uppercase; white-space:nowrap; }\n  .g { position:absolute; inset:0; opacity:0; pointer-events:none; }\n  .flash { position:absolute; inset:0; pointer-events:none; background:#fff; opacity:0; mix-blend-mode:difference; }\n  .sub { position:absolute; left:50%; transform:translateX(-50%); bottom:150px; display:flex; flex-direction:column; align-items:center; gap:16px; white-space:nowrap; font-size:19px; letter-spacing:.42em; color:#6f7378; text-transform:uppercase; opacity:0; }\n  .sub img { width:74px; height:74px; display:block; }\n\n  #ui { position:fixed; right:24px; bottom:24px; display:flex; flex-direction:column; align-items:flex-end; gap:10px; z-index:9; }\n  .btn { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.24em; color:#3a3d41; text-transform:uppercase; background:#000; border:1px solid #1c1e21; padding:8px 13px; cursor:pointer; }\n  .btn:hover { color:#8b9096; border-color:#2e3135; }\n  #panel { display:none; width:276px; max-height:78vh; overflow:auto; background:#000; border:1px solid #1c1e21; padding:18px; flex-direction:column; gap:14px; }\n  #panel.open { display:flex; }\n  .hdr { font-size:10px; letter-spacing:.24em; color:#3a3d41; text-transform:uppercase; border-top:1px solid #1c1e21; padding-top:13px; }\n  .hdr:first-child { border-top:none; padding-top:0; }\n  .row { display:flex; flex-direction:column; gap:7px; }\n  .lab { display:flex; justify-content:space-between; font-size:10px; letter-spacing:.18em; color:#6f7378; text-transform:uppercase; }\n  .lab b { color:#c9ccd1; font-weight:400; }\n  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:1px; background:#2e3135; outline:none; }\n  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:11px; height:11px; background:#e9ebee; cursor:pointer; border-radius:50%; }\n  .seg { display:flex; gap:5px; }\n  .seg button { flex:1; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; color:#4e5257; background:#000; border:1px solid #1c1e21; padding:6px 0; cursor:pointer; text-transform:uppercase; }\n  .seg button.on { color:#0b0b0c; background:#c9ccd1; border-color:#c9ccd1; }\n<\u002Fstyle>\n<\u002Fhead><body>\n\n\n\n<div id=\"stage\">\n  <div class=\"center\"><div id=\"intro\"><\u002Fdiv><\u002Fdiv>\n  <div class=\"center\"><div id=\"lockwrap\">\n    <img id=\"sback\" src=\"505b962c-9a3f-4bdf-b8d3-f2fabe2cbf75\" alt=\"\">\n    <div id=\"lockinner\"><div class=\"lock\">STANDARD<\u002Fdiv><div class=\"ed\">Metrology Edition<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n  <div class=\"sub\" id=\"sub\"><img src=\"179e4790-7b4d-4e3b-94bf-0e2ead7b58f5\" alt=\"MetraSlate\"><span>by MetraSlate<\u002Fspan><\u002Fdiv>\n  <div class=\"flash\" id=\"flash\"><\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"ui\">\n  <div id=\"panel\">\n    <div class=\"hdr\">Timing<\u002Fdiv>\n    <div class=\"row\"><div class=\"lab\"><span>Type<\u002Fspan><b id=\"v-type\"><\u002Fb><\u002Fdiv><input type=\"range\" id=\"t-type\" min=\"0.6\" max=\"3\" step=\"0.1\"><\u002Fdiv>\n    <div class=\"row\"><div class=\"lab\"><span>Hold<\u002Fspan><b id=\"v-hold\"><\u002Fb><\u002Fdiv><input type=\"range\" id=\"t-hold\" min=\"1\" max=\"6\" step=\"0.2\"><\u002Fdiv>\n    <div class=\"hdr\">Glitch<\u002Fdiv>\n    <div class=\"row\"><div class=\"lab\"><span>Force<\u002Fspan><b id=\"v-gamp\"><\u002Fb><\u002Fdiv><input type=\"range\" id=\"t-gamp\" min=\"0\" max=\"1.6\" step=\"0.05\"><\u002Fdiv>\n    <div class=\"row\"><div class=\"lab\"><span>Blips in hold<\u002Fspan><b id=\"v-blip\"><\u002Fb><\u002Fdiv><input type=\"range\" id=\"t-blip\" min=\"0\" max=\"1\" step=\"0.05\"><\u002Fdiv>\n    <div class=\"hdr\">Sound<\u002Fdiv>\n    <div class=\"row\"><div class=\"lab\"><span>Level-up<\u002Fspan><b id=\"v-gv\"><\u002Fb><\u002Fdiv><input type=\"range\" id=\"t-gv\" min=\"1\" max=\"10\" step=\"1\"><\u002Fdiv>\n    <div class=\"row\"><div class=\"lab\"><span>Reverb<\u002Fspan><b id=\"v-rvk\"><\u002Fb><\u002Fdiv><input type=\"range\" id=\"t-rvk\" min=\"0\" max=\"1.5\" step=\"0.05\"><\u002Fdiv>\n    <div class=\"row\"><div class=\"lab\"><span>Echo<\u002Fspan><b id=\"v-eck\"><\u002Fb><\u002Fdiv><input type=\"range\" id=\"t-eck\" min=\"0\" max=\"1.5\" step=\"0.05\"><\u002Fdiv>\n    <div class=\"row\"><div class=\"lab\"><span>Delay time<\u002Fspan><b id=\"v-dtime\"><\u002Fb><\u002Fdiv><input type=\"range\" id=\"t-dtime\" min=\"0.06\" max=\"0.45\" step=\"0.01\"><\u002Fdiv>\n    <div class=\"row\"><div class=\"lab\"><span>Volume<\u002Fspan><b id=\"v-vol\"><\u002Fb><\u002Fdiv><input type=\"range\" id=\"t-vol\" min=\"0\" max=\"1.5\" step=\"0.05\"><\u002Fdiv>\n    <div class=\"row\"><div class=\"seg\"><button id=\"audition\">hear level-up<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex; gap:8px;\">\n    <button class=\"btn\" id=\"snd\">sound off<\u002Fbutton>\n    <button class=\"btn\" id=\"tw\">tweaks<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n(function(){\n  var stage=document.getElementById('stage');\n  function fit(){ var s=Math.min(innerWidth/1920, innerHeight/1080);\n    stage.style.transform='scale('+s+')'; stage.style.left=((innerWidth-1920*s)/2)+'px'; stage.style.top=((innerHeight-1080*s)/2)+'px'; }\n  addEventListener('resize', fit); fit();\n\n  var intro=document.getElementById('intro'), lockwrap=document.getElementById('lockwrap'),\n      lock=document.getElementById('lockinner'), sub=document.getElementById('sub'), flash=document.getElementById('flash');\n  var WORD='INTRODUCING';\n  var clones=[];\n\n  var D={type:1.6, hold:3.2, gamp:1, blip:0.45, gv:3, rvk:1, eck:1, dtime:0.2, vol:0.9};\n  var K='std-intro-1', S=Object.assign({}, D);\n  try { var st=JSON.parse(localStorage.getItem(K)||'{}'); Object.keys(D).forEach(function(k){ if(k in st) S[k]=st[k]; }); } catch(e){}\n  function save(){ try{ localStorage.setItem(K, JSON.stringify(S)); }catch(e){} }\n\n  function makeClones(){\n    clones.forEach(function(c){ c.remove(); }); clones=[];\n    var insets=['inset(0 0 64% 0)','inset(40% 0 32% 0)','inset(70% 0 0 0)'];\n    for (var i=0;i<3;i++){\n      var c=lock.cloneNode(true); c.removeAttribute('id'); c.classList.add('g');\n      c.style.clipPath=insets[i]; lockwrap.appendChild(c); clones.push(c);\n    }\n  }\n\n  /* deterministic per-step hash so seeks reproduce the same frames */\n  function hash(n){ var x=Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); }\n\n  /* ---------- sound ---------- */\n  var LVLUP=[\n    {name:'BELL',    root:784, seq:[0,5,12,17],        w:['sine','sine'],        det:4, step:0.085,dur:0.160,lp:[2400,9000],echo:0.22,spark:3,fm:1},\n    {name:'PRISM',   synth:'future', root:880, seq:[0,7,12,19,24],      step:0.082,dur:0.45,att:0.006,dec:0.32,decL:0.95,harm:[[1,1],[2,0.35],[3,0.15]], panW:0.50,rv:0.40,lp:[2600,11000],echo:0.22},\n    {name:'STARDUST',synth:'future', root:1175,seq:[0,4,9,12,16,21],    step:0.048,dur:0.30,att:0.003,dec:0.18,decL:0.7,harm:[[1,1],[3,0.08]],          panW:0.60,rv:0.70,lp:[3000,12000],echo:0.25},\n    {name:'LUMEN',   synth:'future', root:659, seq:[0,7,12,16],         step:0.130,dur:0.50,att:0.020,dec:0.55,decL:1.2,harm:[[1,1],[2,0.30],[4,0.06]], panW:0.35,rv:0.60,lp:[2000,10000],echo:0.16},\n    {name:'CASCADE', synth:'future', root:1319,seq:[0,2,4,7,9,12,16,19],step:0.042,dur:0.25,att:0.003,dec:0.12,decL:0.6,harm:[[1,1],[2,0.20]],          panW:0.65,rv:0.65,lp:[3200,12000],echo:0.28},\n    {name:'IRIS',    synth:'future', root:988, seq:[0,4,9],             step:0.085,dur:0.40,att:0.008,dec:0.30,decL:1.0,harm:[[1,1],[2,0.28],[3,0.10]], panW:0.45,chord9:1,rv:0.55,lp:[2400,11000],echo:0.20},\n    {name:'COMET',   synth:'future', root:1047,seq:[0,5,10,16,22],      step:0.060,dur:0.35,att:0.004,dec:0.22,decL:0.8,harm:[[0.5,0.18],[1,1],[3,0.10]],panW:0.55,rv:0.70,lp:[2200,11000],echo:0.26},\n    {name:'GUITAR',  synth:'pluckstring', root:220, seq:[0,5,9,12,17], step:0.075,dur:0.8, rv:0.35,lp:[1400,8000], echo:0.18},\n    {name:'SUBDROP', synth:'wob',         root:82,  seq:[12,5,0],      step:0.140,dur:0.28,rv:0.20,lp:[500,3200],  echo:0.12},\n    {name:'LASER',   synth:'zap',         root:523, seq:[0,7,12,19,24],step:0.055,dur:0.3, rv:0.45,lp:[1800,10000],echo:0.30}\n  ];\n  var A=null,on=false,noiseBuf=null,master=null;\n  function initAudio(){\n    A=new (window.AudioContext||window.webkitAudioContext)();\n    var n=Math.floor(A.sampleRate*2), b=A.createBuffer(1,n,A.sampleRate), d=b.getChannelData(0), b0=0,b1=0,b2=0;\n    for (var i=0;i<n;i++){ var w=Math.random()*2-1;\n      b0=0.99765*b0+w*0.0990460; b1=0.96300*b1+w*0.2965164; b2=0.57000*b2+w*1.0526913;\n      d[i]=(b0+b1+b2+w*0.1848)*0.22; }\n    noiseBuf=b;\n    master=A.createGain(); master.gain.value=S.vol; master.connect(A.destination);\n  }\n  function tick(){\n    if(!on||!A) return;\n    var s=A.createBufferSource(); s.buffer=noiseBuf; s.loop=true;\n    var f=A.createBiquadFilter(); f.type='bandpass'; f.frequency.value=5200+Math.random()*1800; f.Q.value=8;\n    var g=A.createGain(); g.gain.setValueAtTime(0.06,A.currentTime);\n    g.gain.exponentialRampToValueAtTime(0.0006,A.currentTime+0.03);\n    s.connect(f); f.connect(g); g.connect(master); s.start(); s.stop(A.currentTime+0.05);\n  }\n  function sweep(){\n    if(!on||!A) return;\n    var s=A.createBufferSource(); s.buffer=noiseBuf; s.loop=true;\n    var f=A.createBiquadFilter(); f.type='bandpass'; f.Q.value=3;\n    f.frequency.setValueAtTime(320,A.currentTime);\n    f.frequency.exponentialRampToValueAtTime(5200,A.currentTime+0.3);\n    var g=A.createGain(); g.gain.setValueAtTime(0.0008,A.currentTime);\n    g.gain.exponentialRampToValueAtTime(0.14,A.currentTime+0.22);\n    g.gain.exponentialRampToValueAtTime(0.0008,A.currentTime+0.34);\n    s.connect(f); f.connect(g); g.connect(master); s.start(); s.stop(A.currentTime+0.4);\n  }\n  function boom(){\n    if(!on||!A) return;\n    var o=A.createOscillator(); o.type='sine';\n    o.frequency.setValueAtTime(130,A.currentTime);\n    o.frequency.exponentialRampToValueAtTime(38,A.currentTime+0.28);\n    var g=A.createGain(); g.gain.setValueAtTime(0.35,A.currentTime);\n    g.gain.exponentialRampToValueAtTime(0.001,A.currentTime+0.42);\n    o.connect(g); g.connect(master); o.start(); o.stop(A.currentTime+0.45);\n    var s=A.createBufferSource(); s.buffer=noiseBuf; s.loop=true;\n    var f=A.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;\n    var g2=A.createGain(); g2.gain.setValueAtTime(0.16,A.currentTime);\n    g2.gain.exponentialRampToValueAtTime(0.001,A.currentTime+0.2);\n    s.connect(f); f.connect(g2); g2.connect(master); s.start(); s.stop(A.currentTime+0.25);\n  }\n  function blipSnd(){\n    if(!on||!A) return;\n    var o=A.createOscillator(); o.type='square'; o.frequency.value=1900+Math.random()*900;\n    var g=A.createGain(); g.gain.setValueAtTime(0.03,A.currentTime);\n    g.gain.exponentialRampToValueAtTime(0.0006,A.currentTime+0.05);\n    o.connect(g); g.connect(master); o.start(); o.stop(A.currentTime+0.06);\n  }\n  var VERB=null;\n  function getVerb(){\n    if(VERB||!A) return VERB;\n    var len=Math.floor(A.sampleRate*1.8), ir=A.createBuffer(2,len,A.sampleRate);\n    for(var ch=0;ch<2;ch++){var d=ir.getChannelData(ch);\n      for(var i=0;i<len;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)*0.5;}}\n    VERB=A.createConvolver(); VERB.buffer=ir; VERB.connect(master);\n    return VERB;}\n  function jingle(amp){\n    if(!on||!A) return;\n    var v=LVLUP[Math.min(S.gv,LVLUP.length)-1]||LVLUP[0], t0a=A.currentTime;\n    var total=v.seq.length*v.step+(v.dur||0.1)*3+1;\n    var bus=A.createGain(); bus.gain.value=1;\n    var lp=A.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=0.8;\n    lp.frequency.setValueAtTime(v.lp[0],t0a);\n    lp.frequency.exponentialRampToValueAtTime(v.lp[1],t0a+Math.min(total*0.8,1.2));\n    var comp=A.createDynamicsCompressor();\n    comp.threshold.value=-18; comp.knee.value=12; comp.ratio.value=5;\n    comp.attack.value=0.002; comp.release.value=0.12;\n    bus.connect(lp); lp.connect(comp);\n    var dry=A.createGain(); dry.gain.value=0.9; comp.connect(dry); dry.connect(master);\n    var dl=A.createDelay(0.6); dl.delayTime.value=Math.min(0.5,S.dtime||0.2);\n    var fb=A.createGain(); fb.gain.setValueAtTime(0.3,t0a);\n    fb.gain.setTargetAtTime(0.0001,t0a+total+0.9,0.1);\n    var wet=A.createGain(); wet.gain.value=v.echo*(S.eck!=null?S.eck:1)*Math.min(1,amp);\n    comp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master);\n    var vb=getVerb();\n    if(vb){ var send=A.createGain(); send.gain.value=(v.rv||0.2)*(S.rvk!=null?S.rvk:1)*Math.min(1,amp);\n      comp.connect(send); send.connect(vb); }\n    function env(at,peak,attack,decay){\n      var g=A.createGain(); g.gain.setValueAtTime(0.0001,at);\n      g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),at+attack);\n      g.gain.setTargetAtTime(0.0001,at+attack+0.004,decay);\n      return g;}\n    function note(f,at,dur,vol,waves,detC,vib){\n      waves.forEach(function(w,wi){\n        var o=A.createOscillator(); o.type=w;\n        o.frequency.setValueAtTime(f,at);\n        o.detune.setValueAtTime(wi?-detC:detC,at);\n        if (vib){ var lf=A.createOscillator(); lf.frequency.value=5.5;\n          var lg=A.createGain(); lg.gain.value=8; lf.connect(lg); lg.connect(o.detune);\n          lf.start(at); lf.stop(at+dur+0.05); }\n        var g=A.createGain();\n        g.gain.setValueAtTime(0.0001,at);\n        g.gain.exponentialRampToValueAtTime(vol/waves.length,at+0.006);\n        g.gain.setTargetAtTime(0.0001,at+dur*0.35,dur*0.28);\n        o.connect(g); g.connect(bus); o.start(at); o.stop(at+dur+0.4);\n      });\n    }\n    if (v.pad){\n      [0,7,14].forEach(function(st2){\n        var o=A.createOscillator(); o.type='triangle';\n        o.frequency.setValueAtTime(v.root*Math.pow(2,st2/12)/2,t0a);\n        var g=A.createGain(); g.gain.setValueAtTime(0.0001,t0a);\n        g.gain.exponentialRampToValueAtTime(0.030*amp,t0a+total*0.35);\n        g.gain.setTargetAtTime(0.0001,t0a+total*0.5,total*0.22);\n        o.connect(g); g.connect(bus); o.start(t0a); o.stop(t0a+total+0.5);\n      });\n    }\n    v.seq.forEach(function(st,i){\n      var f=v.root*Math.pow(2,st/12), at=t0a+i*v.step, last=i===v.seq.length-1;\n      var vol=(last?0.16:0.12)*amp;\n      if (!v.synth){\n        var dur=last?v.dur*3.4:v.dur*1.2;\n        note(f,at,dur,vol,v.w,v.det,last);\n        if (v.fm) note(f*(v.fmx||2.756),at,dur*0.55,vol*0.2,['sine'],0,false);\n        if (last){\n          note(f*2,at+0.012,dur*0.9,vol*0.34*(v.spark/2),['sine'],3,true);\n          note(f*3,at+0.030,dur*0.7,vol*0.16*(v.spark/2),['sine'],5,true);\n          if (v.chord){\n            note(f*Math.pow(2,4/12),at,dur,vol*0.5,v.w,v.det,true);\n            note(f*Math.pow(2,7/12),at,dur,vol*0.5,v.w,v.det,true);\n          }\n        }\n      } else if (v.synth==='pluckstring'){\n        /* Karplus-Strong: noise burst circulating in a tuned, damped delay loop */\n        var per=1/f;\n        var ksn=A.createBufferSource(); ksn.buffer=noiseBuf; ksn.loop=true;\n        var ksb=A.createGain(); ksb.gain.setValueAtTime(0.6,at);\n        ksb.gain.setTargetAtTime(0.0001,at+per*2,per);\n        var ksd=A.createDelay(0.05); ksd.delayTime.value=per;\n        var ksf=A.createGain(); ksf.gain.setValueAtTime(0.93,at);\n        ksf.gain.setTargetAtTime(0.0001,at+(last?1.4:0.9),0.12);\n        var ksl=A.createBiquadFilter(); ksl.type='lowpass'; ksl.frequency.value=4200;\n        var kso=A.createGain(); kso.gain.setValueAtTime(vol*2.2,at);\n        kso.gain.setTargetAtTime(0.0001,at+(last?1.5:1.0),0.15);\n        ksn.connect(ksb); ksb.connect(ksd);\n        ksd.connect(ksl); ksl.connect(ksf); ksf.connect(ksd);\n        ksd.connect(kso); kso.connect(bus);\n        ksn.start(at); ksn.stop(at+per*3+0.01);\n      } else if (v.synth==='wob'){\n        var wo1=A.createOscillator(); wo1.type='sawtooth';\n        wo1.frequency.setValueAtTime(f*1.4,at); wo1.frequency.exponentialRampToValueAtTime(f,at+0.06);\n        var wo2=A.createOscillator(); wo2.type='square';\n        wo2.frequency.setValueAtTime(f*2.8,at); wo2.frequency.exponentialRampToValueAtTime(f*2.02,at+0.06);\n        var wff=A.createBiquadFilter(); wff.type='lowpass'; wff.Q.value=9;\n        wff.frequency.setValueAtTime(last?1000:750,at);\n        var wlf=A.createOscillator(); wlf.type='sine'; wlf.frequency.setValueAtTime(last?6.5:9,at);\n        var wlg=A.createGain(); wlg.gain.setValueAtTime(last?800:450,at);\n        wlf.connect(wlg); wlg.connect(wff.frequency);\n        var wenv=env(at,vol*1.6,0.005,(last?v.dur*2.6:v.dur)*0.6);\n        wo1.connect(wff); wo2.connect(wff); wff.connect(wenv); wenv.connect(bus);\n        var wstop=at+(last?v.dur*3.5:v.dur*1.6);\n        wo1.start(at); wo2.start(at); wlf.start(at);\n        wo1.stop(wstop); wo2.stop(wstop); wlf.stop(wstop);\n      } else if (v.synth==='zap'){\n        var zo=A.createOscillator(); zo.type='square';\n        zo.frequency.setValueAtTime(f*3,at);\n        zo.frequency.exponentialRampToValueAtTime(f,at+0.06);\n        var zo2=A.createOscillator(); zo2.type='sine';\n        zo2.frequency.setValueAtTime(f*6,at);\n        zo2.frequency.exponentialRampToValueAtTime(f*1.5,at+0.05);\n        var zg=env(at,vol*0.9,0.002,last?0.4:0.08);\n        var zg2=env(at,vol*0.35,0.002,0.05);\n        zo.connect(zg); zg.connect(bus); zo2.connect(zg2); zg2.connect(bus);\n        zo.start(at); zo.stop(at+1); zo2.start(at); zo2.stop(at+0.3);\n      } else if (v.synth==='future'){\n        var att=v.att||0.01, dec=last?(v.decL||0.8):(v.dec||0.3);\n        var dest=bus;\n        if (A.createStereoPanner&&v.panW){\n          var pn=A.createStereoPanner();\n          pn.pan.setValueAtTime((i%2?1:-1)*v.panW*(0.4+0.6*i/v.seq.length),at);\n          pn.connect(bus); dest=pn;\n        }\n        (v.harm||[[1,1]]).forEach(function(hh){\n          var o=A.createOscillator(); o.type='sine';\n          o.frequency.setValueAtTime(f*hh[0],at);\n          if (last&&hh[0]===1){ var lf=A.createOscillator(); lf.frequency.value=4.6;\n            var lg=A.createGain(); lg.gain.value=6; lf.connect(lg); lg.connect(o.detune);\n            lf.start(at); lf.stop(at+dec*3); }\n          var g=env(at,vol*hh[1]*0.75,att,dec);\n          o.connect(g); g.connect(dest); o.start(at); o.stop(at+dec*5+0.3);\n        });\n        if (last){\n          [2,3].forEach(function(m,k){\n            var o=A.createOscillator(); o.type='sine';\n            o.frequency.setValueAtTime(f*m*(k?1.002:0.998),at+0.02);\n            var g=env(at+0.02,vol*(k?0.10:0.22),att+0.01,dec*0.9);\n            o.connect(g); g.connect(dest); o.start(at+0.02); o.stop(at+dec*5);\n          });\n          if (v.chord9){\n            [4,14].forEach(function(st2){\n              var o=A.createOscillator(); o.type='sine';\n              o.frequency.setValueAtTime(f*Math.pow(2,st2/12),at);\n              var g=env(at,vol*0.5,att,dec);\n              o.connect(g); g.connect(dest); o.start(at); o.stop(at+dec*5);\n            });\n          }\n        }\n      }\n    });\n    if (!v.synth){\n      var sb=A.createOscillator(); sb.type='sine';\n      sb.frequency.setValueAtTime(v.root/2,t0a);\n      sb.frequency.exponentialRampToValueAtTime(v.root,t0a+v.seq.length*v.step);\n      var sg=A.createGain(); sg.gain.setValueAtTime(0.05*amp,t0a);\n      sg.gain.setTargetAtTime(0.0001,t0a+v.seq.length*v.step,0.09);\n      sb.connect(sg); sg.connect(bus); sb.start(t0a); sb.stop(t0a+total+0.3);\n    }\n  }\n  var btn=document.getElementById('snd');\n  btn.addEventListener('click', function(){\n    if(!A) initAudio(); if(A.state==='suspended') A.resume();\n    on=!on; btn.textContent=on?'sound on':'sound off';\n  });\n  document.getElementById('audition').addEventListener('click', function(){\n    if(!A) initAudio(); if(A.state==='suspended') A.resume();\n    if(!on){ on=true; btn.textContent='sound on'; }\n    jingle(Math.max(0.4,S.gamp));\n  });\n\n  /* ---------- timeline ---------- */\n  var lastChars=-1, lastPhase='', lastBlipStep=-1, sweptAt=-1, boomedAt=-1;\n  function render(tAbs){\n    var TY=S.type*1000, TEAR=340, SLAM=560, Hms=S.hold*1000, Fms=420;\n    var T=TY+TEAR+SLAM+Hms+Fms, t=((tAbs%T)+T)%T;\n    var tyEnd=TY, teEnd=tyEnd+TEAR, slEnd=teEnd+SLAM, hEnd=slEnd+Hms;\n    var phase = t<tyEnd?'t' : t<teEnd?'e' : t<slEnd?'s' : t<hEnd?'h' : 'f';\n    var amp=S.gamp;\n\n    if (phase!==lastPhase){\n      if (phase==='e'){ if(sweptAt!==Math.floor(tAbs/T)){ sweep(); sweptAt=Math.floor(tAbs/T);} }\n      if (phase==='s'){ if(boomedAt!==Math.floor(tAbs/T)){ boom(); jingle(Math.max(0.3,amp)); boomedAt=Math.floor(tAbs/T);} }\n      lastPhase=phase;\n    }\n\n    /* INTRODUCING types on */\n    if (phase==='t'){\n      var typeDur=TY*0.62, n=Math.max(0,Math.min(WORD.length, Math.floor((t/typeDur)*WORD.length)));\n      if (n!==lastChars){ if(n>lastChars && n>0) tick(); lastChars=n; }\n      var curOn = Math.floor(t/265)%2===0;\n      intro.innerHTML = WORD.slice(0,n).split('').join('\\u200a') + (curOn?'<span class=\"cur\"><\u002Fspan>':'');\n      intro.style.opacity=1;\n      intro.style.filter='none'; intro.style.transform='none';\n      lockwrap.style.opacity=0; sub.style.opacity=0; flash.style.opacity=0;\n      clones.forEach(function(c){ c.style.opacity=0; });\n    } else lastChars=-1;\n\n    /* the word tears apart */\n    if (phase==='e'){\n      var et=(t-tyEnd)/TEAR, step=Math.floor((t-tyEnd)/55);\n      intro.innerHTML=WORD.split('').join('\\u200a');\n      intro.style.opacity = et<0.8 ? (hash(step*3+1)<0.25?0.2:1) : 0;\n      var dx=(hash(step)*2-1)*34*amp*et, dy=(hash(step*7+2)*2-1)*10*amp*et;\n      intro.style.transform='translate('+dx.toFixed(0)+'px,'+dy.toFixed(0)+'px) skewX('+((hash(step*5+3)*2-1)*6*et*amp).toFixed(1)+'deg)';\n      intro.style.filter = hash(step*11+4)<0.6*amp\n        ? 'drop-shadow('+(-9*amp*et).toFixed(0)+'px 0 0 #ff0033) drop-shadow('+(9*amp*et).toFixed(0)+'px 0 0 #00e5ff)':'none';\n      flash.style.opacity = hash(step*13+5)<0.14*amp?0.34:0;\n      lockwrap.style.opacity=0; sub.style.opacity=0;\n    }\n\n    /* STANDARD slams in */\n    if (phase==='s'){\n      intro.style.opacity=0;\n      var stq=(t-teEnd)/SLAM, step2=Math.floor((t-teEnd)/55);\n      lockwrap.style.opacity=1;\n      var sc = stq<0.11 ? 1.16-0.16*(stq/0.11) : stq<0.24 ? 0.985+0.015*((stq-0.11)/0.13) : 1;\n      lock.style.transform='scale('+sc.toFixed(3)+')';\n      var heavy = stq<0.55;\n      var hdx=(hash(step2*17+6)*2-1)*(heavy?30:8)*amp;\n      lock.style.filter = (hash(step2*19+7)<(heavy?0.8:0.3)*amp)\n        ? 'drop-shadow('+(-hdx).toFixed(0)+'px 0 0 #ff0033) drop-shadow('+hdx.toFixed(0)+'px 0 0 #00e5ff)':'none';\n      clones.forEach(function(c,i){\n        var onn = hash(step2*23+i*7+8) < (heavy?0.7:0.25)*Math.min(1,amp);\n        c.style.opacity = onn?1:0;\n        c.style.transform='translateX('+((hash(step2*29+i*11+9)*2-1)*54*amp).toFixed(0)+'px) scale('+sc.toFixed(3)+')';\n      });\n      flash.style.opacity = (stq<0.08 || hash(step2*31+10)<0.1*amp) ? 0.42 : 0;\n      sub.style.opacity = Math.max(0, Math.min(1,(stq-0.5)/0.4))*0.9;\n    }\n\n    /* hold with micro blips */\n    if (phase==='h'){\n      intro.style.opacity=0;\n      lockwrap.style.opacity=1; lock.style.transform='none';\n      var bw=Math.floor((t-slEnd)/900), inBlip=((t-slEnd)%900)<70 && hash(bw*37+11)<S.blip;\n      if (inBlip){\n        if (bw!==lastBlipStep){ blipSnd(); lastBlipStep=bw; }\n        var bdx=(hash(bw*41+12)*2-1)*14*amp;\n        lock.style.filter='drop-shadow('+(-bdx).toFixed(0)+'px 0 0 #ff0033) drop-shadow('+bdx.toFixed(0)+'px 0 0 #00e5ff)';\n        clones[bw%3].style.opacity=0.9;\n        clones[bw%3].style.transform='translateX('+((hash(bw*43+13)*2-1)*26*amp).toFixed(0)+'px)';\n      } else {\n        lock.style.filter='none';\n        clones.forEach(function(c){ c.style.opacity=0; c.style.transform='none'; });\n      }\n      flash.style.opacity=0;\n      sub.style.opacity=0.9;\n    } else if (phase!=='s') lastBlipStep=-1;\n\n    /* fade */\n    if (phase==='f'){\n      var ft=(t-hEnd)/Fms;\n      intro.style.opacity=0;\n      lockwrap.style.opacity=1-ft; lock.style.filter='none'; lock.style.transform='none';\n      clones.forEach(function(c){ c.style.opacity=0; });\n      sub.style.opacity=(1-ft)*0.9; flash.style.opacity=0;\n    }\n  }\n  var t0=performance.now();\n  function frame(now){ render(now-t0); requestAnimationFrame(frame); }\n\n  function bind(id,key,fmt){\n    var el=document.getElementById('t-'+id), out=document.getElementById('v-'+id);\n    el.value=S[key]; out.textContent=fmt(S[key]);\n    el.addEventListener('input', function(){ S[key]=parseFloat(el.value); out.textContent=fmt(S[key]); save(); });\n  }\n  document.getElementById('tw').addEventListener('click', function(){ document.getElementById('panel').classList.toggle('open'); });\n\n  function start(){\n    makeClones();\n    bind('type','type',function(v){return v.toFixed(1)+'s';});\n    bind('hold','hold',function(v){return v.toFixed(1)+'s';});\n    bind('gamp','gamp',function(v){return Math.round(v*100)+'%';});\n    bind('blip','blip',function(v){return Math.round(v*100)+'%';});\n    bind('gv','gv',function(v){return (LVLUP[Math.min(v,LVLUP.length)-1]||{}).name||('#'+v);});\n    bind('vol','vol',function(v){return Math.round(v*100)+'%';});\n    bind('rvk','rvk',function(v){return Math.round(v*100)+'%';});\n    bind('eck','eck',function(v){return Math.round(v*100)+'%';});\n    bind('dtime','dtime',function(v){return Math.round(v*1000)+'ms';});\n    t0=performance.now(); requestAnimationFrame(frame);\n  }\n  if (document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ setTimeout(start,60); });\n  else setTimeout(start,500);\n\n  window.seek=function(sec){ t0=performance.now()-sec*1000; };\n  window.renderAt=function(sec){ render(sec*1000); };\n})();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
